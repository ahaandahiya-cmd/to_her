<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f5">
  <title>A little question for my bestie</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #49363c;
      --muted: #927e84;
      --pink: #f18fa2;
      --pink-dark: #dd7188;
      --cream: #fff8f5;
      --card: rgba(255, 255, 255, .84);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 209, 213, .52), transparent 32%),
        radial-gradient(ellipse at 86% 82%, rgba(250, 222, 195, .58), transparent 34%),
        var(--cream);
      font-family: "Segoe UI", ui-rounded, system-ui, -apple-system, sans-serif;
    }
    .sparkle {
      position: fixed;
      color: #e5a6a9;
      opacity: .65;
      user-select: none;
      animation: float 5s ease-in-out infinite;
    }
    .sparkle:nth-of-type(1) { top: 12%; left: 13%; font-size: 24px; }
    .sparkle:nth-of-type(2) { top: 21%; right: 16%; font-size: 18px; animation-delay: -2s; }
    .sparkle:nth-of-type(3) { bottom: 15%; left: 19%; font-size: 19px; animation-delay: -1s; }
    .sparkle:nth-of-type(4) { right: 12%; bottom: 22%; font-size: 25px; animation-delay: -3s; }
    @keyframes float { 50% { transform: translateY(-9px) rotate(8deg); } }
    .card {
      width: min(100%, 510px);
      padding: clamp(34px, 8vw, 58px) clamp(24px, 7vw, 54px);
      border: 1px solid rgba(237, 203, 198, .62);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 24px 70px rgba(111, 71, 78, .11), 0 3px 10px rgba(111, 71, 78, .04);
      text-align: center;
      backdrop-filter: blur(10px);
      animation: arrive .7s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 999px;
      background: #fff0ef;
      color: #b8737f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    h1 {
      margin: 25px 0 13px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 10vw, 58px);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: 1.04;
    }
    h1 span { color: var(--pink-dark); font-style: italic; }
    .message {
      max-width: 340px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }
    .buttons {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 94px;
      margin-top: 22px;
    }
    button {
      min-width: 116px;
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      touch-action: manipulation;
    }
    button:focus-visible { outline: 3px solid #bb7180; outline-offset: 4px; }
    #yes {
      color: white;
      background: var(--pink);
      box-shadow: 0 7px 16px rgba(221, 113, 136, .25);
    }
    #yes:hover { transform: translateY(-2px); background: var(--pink-dark); box-shadow: 0 10px 22px rgba(221, 113, 136, .32); }
    #no {
      position: relative;
      z-index: 2;
      color: #806f74;
      border: 1px solid #eadadd;
      background: #fff;
    }
    #no.is-running { position: fixed; transition: left .2s ease, top .2s ease, transform .15s ease; }
    .hint { min-height: 18px; margin: 0; color: #ad9298; font-size: 12px; }
    .heart { display: inline-block; color: var(--pink-dark); animation: heartbeat 1.4s ease-in-out infinite; }
    @keyframes heartbeat { 50% { transform: scale(1.2); } }
    .success h1 { font-size: clamp(39px, 10vw, 54px); }
    .success .message { font-size: 17px; }
    .success .big-heart { display: block; margin: 18px 0 4px; font-size: 58px; animation: heartbeat 1.4s ease-in-out infinite; }
    .success .eyebrow { background: #fff0ef; }
    @media (max-width: 440px) {
      .sparkle:nth-of-type(1) { left: 6%; }
      .sparkle:nth-of-type(2) { right: 7%; }
      .sparkle:nth-of-type(3) { left: 8%; }
      .sparkle:nth-of-type(4) { right: 6%; }
      .card { border-radius: 25px; }
      .buttons { gap: 10px; }
      button { min-width: 105px; padding-inline: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <span class="sparkle" aria-hidden="true">✦</span>
  <span class="sparkle" aria-hidden="true">♡</span>
  <span class="sparkle" aria-hidden="true">✧</span>
  <span class="sparkle" aria-hidden="true">♡</span>

  <main class="card" id="card" aria-live="polite">
    <div class="eyebrow"><span aria-hidden="true">♡</span> A tiny question</div>
    <h1>Please forgive <span>me.</span></h1>
    <p class="message">You mean the world to me, bestie. I’m really sorry, and I hope we can be okay again.</p>
    <div class="buttons" id="buttons">
      <button id="yes" type="button">Yes, of course</button>
      <button id="no" type="button">No</button>
    </div>
    <p class="hint" id="hint" aria-live="polite">(The “No” button is feeling a little shy.)</p>
  </main>

  <script>
    const noButton = document.querySelector('#no');
    const yesButton = document.querySelector('#yes');
    const hint = document.querySelector('#hint');
    const card = document.querySelector('#card');
    let escapeCount = 0;

    function moveNoButton() {
      const padding = 16;
      const maxX = Math.max(padding, window.innerWidth - noButton.offsetWidth - padding);
      const maxY = Math.max(padding, window.innerHeight - noButton.offsetHeight - padding);
      const x = padding + Math.random() * (maxX - padding);
      const y = padding + Math.random() * (maxY - padding);
      noButton.classList.add('is-running');
      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;
      escapeCount += 1;
      if (escapeCount === 1) hint.textContent = 'Hehe, too slow! Try again?';
      else if (escapeCount === 3) hint.textContent = 'That button really doesn’t want to say no. ♡';
    }

    noButton.addEventListener('pointerenter', moveNoButton);
    noButton.addEventListener('focus', moveNoButton);
    noButton.addEventListener('click', moveNoButton);
    yesButton.addEventListener('click', () => {
      card.classList.add('success');
      card.innerHTML = `
        <div class="eyebrow"><span aria-hidden="true">♡</span> Besties again</div>
        <span class="big-heart" aria-hidden="true">💗</span>
        <h1>Thank you <span>so much!</span></h1>
        <p class="message">You have no idea how happy that makes me. Love you, bestie! <span class="heart" aria-hidden="true">♥</span></p>
      `;
      noButton.remove();
    });

    window.addEventListener('resize', () => {
      if (noButton.classList.contains('is-running')) {
        noButton.style.left = `${Math.min(parseFloat(noButton.style.left), window.innerWidth - noButton.offsetWidth - 8)}px`;
        noButton.style.top = `${Math.min(parseFloat(noButton.style.top), window.innerHeight - noButton.offsetHeight - 8)}px`;
      }
    });
  </script>
</body>
</html>
